# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
version: "2"
language: "en-US"
tone_instructions: "Be extremely thorough, strict, and precise. Scrutinize architecture, security, performance, WebRTC, cryptographic robustness, and Flutter/Dart best practices across the entire repository."
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"
chat:
  auto_reply: true
